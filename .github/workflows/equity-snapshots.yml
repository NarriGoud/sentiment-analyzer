# .github/workflows/equity-snapshots.yml
name: Equity Snapshots
on:
  schedule:
    - cron: '*/5 4-10 * * 1-5'  # 9:15 AM - 3:30 PM IST, Mon-Fri
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -X POST "https://marketmind-demo-backend.onrender.com/cron/equity-snapshot" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 10
