# .github/workflows/equity-snapshots.yml
on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'  # 5-min intervals, 9:15 AM - 3:30 PM IST (Mon-Fri)
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - run: curl -X POST "https://marketmind-demo-backend.onrender.com/cron/equity-snapshot" -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 10
